    <main class="container">    
        <div class="card" data-size="xl">
            <h1>Heading 1</h1>
            <p>This is card-xl</p>
        </div>
        <div class="card" data-size="lg">
            <h2>Heading 2</h2>
            <p>This is card-lg</p>
        </div>

        <div class="card" data-size="md">
            <!-- PRIMARY BUTTONS -->
            <button data-btn="primary">Save Changes</button>
            <button data-btn="primary" data-size="sm">Small Primary</button>
            <button data-btn="primary" data-size="lg">Large Primary</button>
            <button data-btn="primary" data-width="full">Full Width Primary</button>
            <button data-btn="primary" disabled>Disabled Primary</button>
            
            <!-- SECONDARY BUTTONS -->
            <button data-btn="secondary">Cancel</button>
            <button data-btn="secondary" data-size="lg">Large Secondary</button>
            
            <!-- INFO BUTTONS (Primary CTA) -->
            <button data-btn="info">Create New</button>
            <button data-btn="info" data-size="sm">Small Info</button>
            <button data-btn="info" data-size="lg">Large Info</button>
            <button data-btn="info" data-width="full">Full Width Info</button>
            <button data-btn="info" disabled>Disabled Info</button>
            
            <!-- SUCCESS BUTTONS -->
            <button data-btn="success">Confirm</button>
            <button data-btn="success" data-size="lg">Large Success</button>
            
            <!-- DANGER BUTTONS -->
            <button data-btn="danger">Delete</button>
            <button data-btn="danger" data-size="lg">Large Danger</button>
            
            <!-- WARNING BUTTONS -->
            <button data-btn="warning">Caution</button>
            <button data-btn="warning" data-size="lg">Large Warning</button>
            
            <!-- GHOST BUTTONS (Secondary/Tertiary action) -->
            <button data-btn="ghost">Skip</button>
            <button data-btn="ghost" data-size="lg">Large Ghost</button>
            
            <!-- LINKS STYLED AS BUTTONS -->
            <a href="/page" data-btn="info">Go to Page</a>
            <a href="/create" data-btn="info" data-size="lg">Create Something</a>
            
            <!-- COMBINED EXAMPLE -->
            <div class="row-end">
                <button data-btn="ghost">Cancel</button>
                <button data-btn="info" data-size="lg">Save Changes</button>
            </div>
            
            <!-- WITH ICONS (using flexbox) -->
            <button data-btn="info">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16">
                    <!-- Your icon SVG here -->
                </svg>
                Create
            </button>
            
            <!-- LOADING STATE -->
            <button data-btn="info" class="is-loading" disabled>
                <span>Saving...</span>
            </button>
            <h3>Heading 3</h3>
            <p>This is card-md</p>
        </div>
        
        <div class="card" data-size="sm">
            <h4>Heading 4</h4>
            <p>This is card-sm</p>
        </div>
    </main>
</body>
</html>
